[project]
name = "mischooldata-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geoalchemy2>=0.15",
    "geocoder",
    "geopandas>=1.1.1",
    "inequalitytools",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "pandera>=0.20.0",
    "psycopg>=3.2.9",
    "sqlalchemy>=2.0.41",
    "tomli>=2.2.1",
]

[tool.uv.sources]
mischooldata-etl = { workspace = true }
inequalitytools = { path = "../inequalitytools", editable = true }
# d3geocoder (package name `geocoder`), checked out next to this repo.
geocoder = { path = "../d3geocoder", editable = true }

[dependency-groups]
dev = [
    "mischooldata-etl",
]
